<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indo Solar Calculator</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .calculator-box {
            position: absolute; top: 20px; left: 20px; width: 380px;
            background: rgba(255, 255, 255, 0.95); padding: 25px;
            border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 1000; max-height: calc(100vh - 40px); overflow-y: auto; backdrop-filter: blur(5px);
        }

        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        label { font-weight: bold; margin-top: 12px; display: block; color: #34495e; font-size: 14px;}
        input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; }

        .search-container { display: flex; gap: 8px; margin-top: 4px; }
        .search-container input { margin-top: 0; }
        .search-container button { margin-top: 0; width: 40%; padding: 10px; background-color: #2980b9; color:white; border:none; border-radius:4px; cursor:pointer;}

        button.action-btn { width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 20px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button.action-btn:hover { background-color: #2ecc71; }

        .roof-card { background: #f8f9fa; border: 1px solid #dcdde1; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .roof-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #2980b9; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 10px;}

        /* --- THE NEW PRO COMPASS --- */
        .map-compass-container {
            width: 80px; height: 80px; background: rgba(255,255,255,0.8);
            border-radius: 50%; border: 4px solid #2c3e50; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: grab;
            display: flex; justify-content: center; align-items: center;
        }
        /* The Compass Markings */
        .map-compass-container::before { content: 'N'; position: absolute; top: 2px; font-size: 12px; font-weight: bold; color: #2c3e50; }
        .map-compass-container::after { content: 'S'; position: absolute; bottom: 2px; font-size: 12px; font-weight: bold; color: #2c3e50; }

        /* The Center Dot (Used for Moving) */
        .compass-center {
            width: 14px; height: 14px; background: #2c3e50; border-radius: 50%;
            position: absolute; top: 29px; left: 29px; z-index: 10; cursor: move;
            border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* The Needle (Used for Rotating) */
        .map-compass-arrow {
            width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 35px solid #e74c3c;
            position: absolute; top: 1px; left: 28px;
            transform-origin: 8px 35px; /* Anchored perfectly to the center dot */
            pointer-events: none;
        }

        /* --- THE NEW INTERACTIVE TILT VISUALIZER --- */
        .tilt-visualizer {
            width: 100%; height: 90px; background: #ecf0f1; margin-top: 10px;
            border-radius: 5px; position: relative; overflow: hidden; border: 1px solid #bdc3c7;
            cursor: ns-resize; /* Shows up/down arrow cursor */
        }
        /* The Solar Panel */
        .roof-line {
            width: 80%; height: 12px; background: #2980b9; border: 2px solid #1abc9c; border-radius:3px;
            position: absolute; bottom: 20px; left: 10%;
            transform-origin: left center; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        /* The Roof Base */
        .house-base { width: 100%; height: 20px; background: #7f8c8d; position: absolute; bottom: 0;}
        .tilt-instruction { position:absolute; top: 5px; left: 10px; font-size: 10px; color:#7f8c8d; pointer-events:none;}

    </style>
</head>
<body>

<div id="map"></div>

<div class="calculator-box">
    <h2>☀️ Indo Solar Pro</h2>

    <label>1. Find your building:</label>
    <div class="search-container">
        <input type="text" id="address-input" placeholder="e.g., ITB Bandung...">
        <button type="button" onclick="geocodeAddress()">Search</button>
    </div>

    <div style="display: flex; gap: 10px;">
        <div style="width: 50%;">
            <label>Latitude:</label>
            <input type="number" id="lat" value="-6.2000" step="0.0001" onchange="updateMapFromInputs()">
        </div>
        <div style="width: 50%;">
            <label>Longitude:</label>
            <input type="number" id="lon" value="106.8166" step="0.0001" onchange="updateMapFromInputs()">
        </div>
    </div>

    <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">

    <label>2. Select Hardware:</label>
    <select id="panel-brand">
        <option value="Canadian_Solar_Inc__CS6K_285M">Canadian Solar 285W</option>
        <option value="LONGi_Green_Energy_Technology_Co___Ltd__LR5_72HBD_540M">Longi Hi-MO 540W</option>
    </select>

    <label style="color: #c0392b; margin-top: 20px;">3. Use the polygon tool on the map to draw your roof spaces!</label>

    <div id="roof-spaces-container"></div>

    <button onclick="calculateSolar()" class="action-btn" id="calc-btn">Calculate Total Power</button>
    <button onclick="clearRoofs()" style="width: 100%; padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; margin-top: 10px; cursor:pointer;">Clear All Roofs</button>
</div>

<script>
    let map, marker, drawnItems;
    let roofCount = 0;
    let compassMarkers = {};
    let activeCompassId = null;
    let activeTiltId = null;

    // ==========================================
    // 1. SET UP MAP & DRAWING TOOLS
    // ==========================================
    document.addEventListener("DOMContentLoaded", function() {
        map = L.map('map', { zoomControl: false }).setView([-6.2000, 106.8166], 18);
        L.control.zoom({ position: 'topright' }).addTo(map);

        let streetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        let satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

        L.control.layers({"Satellite View": satelliteMap, "Street Map": streetMap}, null, { position: 'topright' }).addTo(map);

        marker = L.marker([-6.2000, 106.8166], {draggable: true}).addTo(map);
        marker.on('dragend', function(e) {
            let pos = marker.getLatLng();
            document.getElementById('lat').value = pos.lat.toFixed(4);
            document.getElementById('lon').value = pos.lng.toFixed(4);
        });

        drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        let drawControl = new L.Control.Draw({
            position: 'topright',
            draw: { polygon: { shapeOptions: { color: '#2ecc71', fillOpacity: 0.4 } }, polyline: false, rectangle: false, circle: false, marker: false, circlemarker: false }
        });
        map.addControl(drawControl);

        // --- THE VANISH FEATURE ---
        // Hide marker and compasses when drawing starts
        map.on('draw:drawstart', function() {
            marker.setOpacity(0);
            for(let id in compassMarkers) {
                compassMarkers[id].setOpacity(0);
            }
        });

        // Bring them back if they stop drawing
        map.on('draw:drawstop', function() {
            marker.setOpacity(1);
            for(let id in compassMarkers) {
                compassMarkers[id].setOpacity(1);
            }
        });

        map.on(L.Draw.Event.CREATED, function (e) {
            let layer = e.layer;
            drawnItems.addLayer(layer);

            let latlngs = layer.getLatLngs()[0];
            let areaSqm = L.GeometryUtil.geodesicArea(latlngs);
            let estimatedPanels = Math.max(1, Math.floor(areaSqm / 2.5));

            roofCount++;
            createRoofCard(roofCount, areaSqm, estimatedPanels);

            let center = layer.getBounds().getCenter();
            createOnMapCompass(roofCount, center);
        });
    });

    function updateMapFromInputs() {
        const lat = parseFloat(document.getElementById('lat').value);
        const lon = parseFloat(document.getElementById('lon').value);
        if (!isNaN(lat) && !isNaN(lon)) {
            map.setView([lat, lon], 18);
            marker.setLatLng([lat, lon]);
        }
    }

    async function geocodeAddress() {
        const address = document.getElementById('address-input').value;
        if (!address) return;
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
            const data = await response.json();
            if (data.length > 0) {
                map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 19);
                marker.setLatLng([parseFloat(data[0].lat), parseFloat(data[0].lon)]);
            }
        } catch (error) {}
    }

    // ==========================================
    // 2. THE NEW PRO COMPASS LOGIC
    // ==========================================
    function createOnMapCompass(id, latlng) {
        let icon = L.divIcon({
            className: 'custom-compass-icon',
            html: `<div class="map-compass-container" id="map-compass-${id}" onmousedown="startCompassRotate(event, ${id})">
                     <div class="compass-center"></div>
                     <div class="map-compass-arrow" id="map-arrow-${id}" style="transform: rotate(180deg);"></div>
                   </div>`,
            iconSize: [80, 80],
            iconAnchor: [40, 40]
        });

        // Set the marker to be draggable by default so they can move it!
        let compassMarker = L.marker(latlng, {icon: icon, draggable: true}).addTo(map);
        compassMarkers[id] = compassMarker;
        compassMarker.on('dblclick', function(e) { L.DomEvent.stopPropagation(e); });
    }

    // Rotate Math
    function startCompassRotate(e, id) {
        // If they click the center dot, let Leaflet handle the Drag-to-Move instead!
        if (e.target.className === 'compass-center') return;

        L.DomEvent.disableClickPropagation(e.target);
        map.dragging.disable();
        activeCompassId = id;
        document.addEventListener('mousemove', rotateCompass);
        document.addEventListener('mouseup', stopCompassRotate);
    }

    function rotateCompass(e) {
        if (!activeCompassId) return;
        let compassElement = document.getElementById(`map-compass-${activeCompassId}`);
        let rect = compassElement.getBoundingClientRect();
        let centerX = rect.left + rect.width / 2;
        let centerY = rect.top + rect.height / 2;

        let radians = Math.atan2(e.clientX - centerX, -(e.clientY - centerY));
        let degrees = Math.round(radians * (180 / Math.PI));
        if (degrees < 0) degrees += 360;

        document.getElementById(`azimuth-input-${activeCompassId}`).value = degrees;
        document.getElementById(`map-arrow-${activeCompassId}`).style.transform = `rotate(${degrees}deg)`;
    }

    function stopCompassRotate() {
        document.removeEventListener('mousemove', rotateCompass);
        document.removeEventListener('mouseup', stopCompassRotate);
        activeCompassId = null;
        map.dragging.enable();
    }

    function manualCompassUpdate(id, value) {
        document.getElementById(`map-arrow-${id}`).style.transform = `rotate(${value}deg)`;
    }

    // ==========================================
    // 3. THE NEW TILT VISUALIZER LOGIC
    // ==========================================
    function createRoofCard(id, area, panelCount) {
        let container = document.getElementById('roof-spaces-container');

        let cardHTML = `
            <div class="roof-card" id="roof-${id}">
                <div class="roof-header">
                    <span>Roof Space #${id}</span>
                    <span style="color:#7f8c8d; font-size: 12px;">Area: ${area.toFixed(1)} m²</span>
                </div>

                <div style="display:flex; gap:10px;">
                    <div style="width:50%;">
                        <label>Azimuth (0-359):</label>
                        <input type="number" id="azimuth-input-${id}" value="180" oninput="manualCompassUpdate(${id}, this.value)">
                    </div>
                    <div style="width:50%;">
                        <label>Roof Tilt (Deg):</label>
                        <input type="number" id="tilt-input-${id}" value="10" oninput="manualTiltUpdate(${id}, this.value)">
                    </div>
                </div>

                <div class="tilt-visualizer" id="tilt-box-${id}" onmousedown="startTiltDrag(event, ${id})">
                    <span class="tilt-instruction">Click & Drag up/down</span>
                    <div class="roof-line" id="roof-line-${id}" style="transform: rotate(-10deg);"></div>
                    <div class="house-base"></div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
    }

    // Drag-to-Tilt Math
    let startY = 0;
    let startAngle = 0;

    function startTiltDrag(e, id) {
        activeTiltId = id;
        startY = e.clientY;
        startAngle = parseFloat(document.getElementById(`tilt-input-${id}`).value);
        document.addEventListener('mousemove', dragTilt);
        document.addEventListener('mouseup', stopTiltDrag);
    }

    function dragTilt(e) {
        if (!activeTiltId) return;
        // Calculate how far the mouse moved up or down
        let deltaY = startY - e.clientY;

        // 1 pixel of movement = roughly 0.5 degrees
        let newAngle = Math.round(startAngle + (deltaY * 0.5));

        // Lock it between 0 (flat) and 90 (wall)
        if (newAngle < 0) newAngle = 0;
        if (newAngle > 90) newAngle = 90;

        document.getElementById(`tilt-input-${activeTiltId}`).value = newAngle;
        document.getElementById(`roof-line-${activeTiltId}`).style.transform = `rotate(-${newAngle}deg)`;
    }

    function stopTiltDrag() {
        document.removeEventListener('mousemove', dragTilt);
        document.removeEventListener('mouseup', stopTiltDrag);
        activeTiltId = null;
    }

    function manualTiltUpdate(id, value) {
        if (value < 0) value = 0;
        if (value > 90) value = 90;
        document.getElementById(`roof-line-${id}`).style.transform = `rotate(-${value}deg)`;
    }

    function clearRoofs() {
        drawnItems.clearLayers();
        document.getElementById('roof-spaces-container').innerHTML = "";
        roofCount = 0;
        for (let key in compassMarkers) { map.removeLayer(compassMarkers[key]); }
        compassMarkers = {};
    }

    // ==========================================
    // 4. API CALL
    // ==========================================
    async function calculateSolar() {
        if (roofCount === 0) { alert("Please draw at least one roof space!"); return; }

        const button = document.getElementById('calc-btn');
        button.innerText = "Calculating..."; button.style.backgroundColor = "#95a5a6";

        let arrayConfigs = [];
        for (let i = 1; i <= roofCount; i++) {
            arrayConfigs.push({
                fix_mount: true,
                Tilt: parseFloat(document.getElementById(`tilt-input-${i}`).value),
                Azimuth: parseFloat(document.getElementById(`azimuth-input-${i}`).value),
                Racking_Model: "close_mount"
            });
        }

        const requestData = {
            latitude: parseFloat(document.getElementById('lat').value),
            longitude: parseFloat(document.getElementById('lon').value),
            module_name: document.getElementById('panel-brand').value,
            inverter_name: "ABB__MICRO_0_25_I_OUTD_US_208__208V_",
            arrays: arrayConfigs
        };

        try {
            const response = await fetch("http://127.0.0.1:8000/simulate", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestData)
            });
            const result = await response.json();
            if (result.status === "success") {
                alert("Check Python console for details while we build the result box.");
            } else alert("Error: " + result.message);
        } catch (error) { alert("Server connection failed."); }

        button.innerText = "Calculate Total Power"; button.style.backgroundColor = "#27ae60";
    }
</script>

</body>
</html>
